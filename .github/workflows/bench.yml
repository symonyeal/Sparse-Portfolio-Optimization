name: Public benchmark cases
on:
  workflow_dispatch:
    inputs:
      cases:
        description: 'JSON array of public case keys or prefixes'
        required: true
        default: '["g1-port1", "rq5-port1-K5-f1", "f4-indtrack1", "f5-indtrack1-S36-N6-K2"]'
      seconds:
        description: 'Per-solve limit in seconds'
        required: true
        default: '60'
permissions:
  contents: read
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        case: ${{ fromJSON(inputs.cases) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run case
        env:
          CASE: ${{ matrix.case }}
          SECONDS: ${{ inputs.seconds }}
        run: cargo run --release --locked -- bench --run --only "$CASE" --time "$SECONDS" --jobs 1 --missing --allow-long
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.case }}
          path: docs/results/
