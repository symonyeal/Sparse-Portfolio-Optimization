name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: cargo build --release --locked --manifest-path native/Cargo.toml
      - run: cargo test --locked --manifest-path native/Cargo.toml
      - run: cargo fmt --manifest-path native/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path native/Cargo.toml -- -D warnings
      - run: python -m pytest -q -m 'not slow and not net'
        env:
          PF_NATIVE: ${{ github.workspace }}/native/target/release/libpf_hold.so
      - run: python -m ruff check .
      - run: python -m pip check
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-research.txt
      - run: python -m pip install -r requirements-research.txt
      - run: python -m pytest tests/test_external.py -q
      - run: python run_compare.py
      - run: python -m pip check
